[package]
name = "tako"
version = "0.1.6"
edition = "2021"
description = "A tiny AI router: one endpoint, many providers, automatic fallback."
license = "MIT"
repository = "https://github.com/real-kijmoshi/tako"
readme = "README.md"
include = ["/assets/**", "/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/deploy/**"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "signal", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
toml_edit = "0.22"
sha2 = "0.11.1"
rpassword = "7.5.5"
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
