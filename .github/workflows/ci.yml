name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/dashboard.py
      - run: python3 tests/auth.py
      - run: python3 tests/installer.py
      - run: python3 tests/auto_update.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests
      - run: node tests/web.cjs
      - run: node tests/landing.cjs
      - run: sh -n install.sh
