name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Check tag matches package version
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml'
          PY
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/dashboard.py && python3 tests/auth.py && python3 tests/installer.py && python3 tests/auto_update.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests
      - run: node tests/web.cjs
      - run: node tests/landing.cjs
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: tako-macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: tako-macos-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: tako-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: tako-linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/tako ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check assets and generate checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'tako-*' | wc -l)" -eq 4
          cd dist
          sha256sum tako-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: tako ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/tako-*
            dist/SHA256SUMS
